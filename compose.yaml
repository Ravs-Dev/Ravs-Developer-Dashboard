services:
  dashboard:
    build: .
    container_name: ravs-developer-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_DIR: /var/data/sessions
    ports:
      - "3000:3000"
    volumes:
      - ravs-dashboard-data:/var/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  ravs-dashboard-data:
